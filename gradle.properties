# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Force K/N compiler to run out-of-process (separate JVM per link task) and give each 6 GiB.
# In-process mode (default) shares the Gradle daemon heap causing OOM on parallel iOS release links.
# Out-of-process adds ~2-4s JVM startup per link invocation (acceptable for this repo).
# Override locally if needed: -Pkotlin.native.disableCompilerDaemon=false
# Revisit on KGP upgrades — in-process K/N memory accounting may improve.
# See: NativeProperties.kt in KGP 2.3.10; issue #259
kotlin.native.disableCompilerDaemon=true
# Heap per out-of-process K/N link JVM (inline comments are not supported in .properties values).
kotlin.native.jvmArgs=-Xmx6g

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Android — General
android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=true
android.enableJetifier=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true

# Android — DSL & Kotlin
android.builtInKotlin=true
android.newDsl=true

# Android — Dependencies
android.dependency.useConstraints=false

# Android — Build Features
android.defaults.buildfeatures.resvalues=false

# Android — Testing
android.default.androidx.test.runner=true
android.onlyEnableUnitTestForTheTestedBuildType=true

# Android — R8 / ProGuard
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.r8.strictInputValidation=true
android.proguard.failOnMissingFiles=true

# Publishing
VERSION_NAME=1.2.1-SNAPSHOT

# Dokka
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
